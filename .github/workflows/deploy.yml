name: Deploy

on:
  push:
    branches: [main]

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: dotnet build
        run: dotnet build backend/TraceMonitor.slnx -c Release

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm install && build
        working-directory: frontend
        run: |
          npm install
          npm run build

  deploy:
    needs: build-check
    # Runs on the runner installed directly on the Proxmox CT (10.0.93.113) — the CT polls
    # GitHub for jobs, so no inbound SSH from the internet to the private LAN is needed.
    runs-on: [self-hosted, trace-monitor]
    steps:
      - name: Pull and redeploy
        run: |
          set -e
          cd /opt/trace-monitor
          git fetch --all
          git reset --hard origin/main
          docker compose up -d --build
